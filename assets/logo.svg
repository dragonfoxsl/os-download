<svg width="560" height="160" viewBox="0 0 560 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="560" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#100e18"/>
      <stop offset="100%" stop-color="#0c0b14"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a020"/>
      <stop offset="100%" stop-color="#c87010"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c050"/>
      <stop offset="100%" stop-color="#e8a020"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="560" height="160" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle border -->
  <rect width="560" height="160" rx="14" fill="none" stroke="#2a2440" stroke-width="1"/>

  <!-- ── Icon: ISO disc + download arrow ── -->

  <!-- Outer disc ring -->
  <circle cx="80" cy="80" r="46" stroke="url(#discGrad)" stroke-width="3" fill="#1a1628" filter="url(#glow)"/>

  <!-- Data track ring -->
  <circle cx="80" cy="80" r="34" stroke="#e8a020" stroke-width="1" stroke-opacity="0.25" fill="none"/>
  <circle cx="80" cy="80" r="22" stroke="#e8a020" stroke-width="1" stroke-opacity="0.15" fill="none"/>

  <!-- Center hole -->
  <circle cx="80" cy="80" r="9" fill="#100e18" stroke="#e8a020" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Download arrow shaft -->
  <line x1="80" y1="52" x2="80" y2="78" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Arrow head -->
  <path d="M71 71 L80 82 L89 71" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Small orbit dots suggesting multiple OSes -->
  <circle cx="80" cy="34" r="3" fill="#e8a020" opacity="0.5"/>
  <circle cx="113" cy="57" r="2" fill="#e8a020" opacity="0.35"/>
  <circle cx="47" cy="57" r="2" fill="#e8a020" opacity="0.35"/>

  <!-- ── Wordmark ── -->
  <text
    x="148"
    y="68"
    font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace"
    font-size="40"
    font-weight="700"
    fill="#f5f0e8"
    letter-spacing="-1.5"
  >os-download</text>

  <!-- Tagline -->
  <text
    x="150"
    y="97"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif"
    font-size="15"
    fill="#8a8070"
    letter-spacing="0.2"
  >Find and download OS ISO images automatically</text>

  <!-- ── Tech badges ── -->
  <!-- Python -->
  <rect x="147" y="112" width="88" height="24" rx="12" fill="#1e1a2e" stroke="#e8a020" stroke-width="1" stroke-opacity="0.4"/>
  <text x="191" y="129" font-family="'SF Mono', monospace" font-size="11" fill="#e8a020" text-anchor="middle" opacity="0.9">Python 3.10+</text>

  <!-- uv -->
  <rect x="243" y="112" width="38" height="24" rx="12" fill="#1e1a2e" stroke="#e8a020" stroke-width="1" stroke-opacity="0.4"/>
  <text x="262" y="129" font-family="'SF Mono', monospace" font-size="11" fill="#e8a020" text-anchor="middle" opacity="0.9">uv</text>

  <!-- rich -->
  <rect x="289" y="112" width="44" height="24" rx="12" fill="#1e1a2e" stroke="#e8a020" stroke-width="1" stroke-opacity="0.4"/>
  <text x="311" y="129" font-family="'SF Mono', monospace" font-size="11" fill="#e8a020" text-anchor="middle" opacity="0.9">rich</text>

  <!-- MIT -->
  <rect x="341" y="112" width="40" height="24" rx="12" fill="#1e1a2e" stroke="#e8a020" stroke-width="1" stroke-opacity="0.4"/>
  <text x="361" y="129" font-family="'SF Mono', monospace" font-size="11" fill="#e8a020" text-anchor="middle" opacity="0.9">MIT</text>
</svg>
