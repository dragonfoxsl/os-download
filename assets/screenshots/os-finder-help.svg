<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480">
<rect width="980" height="480" rx="14" fill="#1e1e2e"/>
<rect x="0" y="0" width="980" height="42" rx="14" fill="#181825"/>
<path d="M0 28 Q0 42 14 42 H966 Q980 42 980 28 V42 H0 Z" fill="#181825"/>
<circle cx="24" cy="21" r="6" fill="#f38ba8"/>
<circle cx="46" cy="21" r="6" fill="#f9e2af"/>
<circle cx="68" cy="21" r="6" fill="#a6e3a1"/>
<text x="490" y="26" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#7f849c">os-finder --help</text>
<text x="24" y="64" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#a6e3a1">$ os-finder --help</text>
<text x="24" y="92" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">usage: os-finder [-h]</text>
<text x="24" y="112" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">                 [--os {ubuntu,opnsense,pfsense,debian,truenas,windows11,manjaro,mxlinux,puppy,cachyos,all} [{ubuntu,opnsense,pfsense,debian,truenas,windows11,manjaro,mxlinux,puppy,cachyos,all} ...]]</text>
<text x="24" y="132" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">                 [--no-interactive] [--output OUTPUT] [--timeout TIMEOUT]</text>
<text x="24" y="152" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">                 [--json] [--log FILE]</text>
<text x="24" y="172" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4"></text>
<text x="24" y="192" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">Multi-OS Download Link Finder</text>
<text x="24" y="212" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4"></text>
<text x="24" y="232" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">options:</text>
<text x="24" y="252" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">  -h, --help            show this help message and exit</text>
<text x="24" y="272" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">  --os {ubuntu,opnsense,pfsense,debian,truenas,windows11,manjaro,mxlinux,puppy,cachyos,all} [{ubuntu,opnsense,pfsense,debian,truenas,windows11,manjaro,mxlinux,puppy,cachyos,all} ...]</text>
<text x="24" y="292" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">                        Operating systems to find download links for</text>
<text x="24" y="312" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">  --no-interactive      Disable the override URL prompt when a link cannot be</text>
<text x="24" y="332" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">                        found</text>
<text x="24" y="352" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">  --output OUTPUT       Output file for ISO URLs (default: ./os-</text>
<text x="24" y="372" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">                        links/all_os.txt)</text>
<text x="24" y="392" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">  --timeout TIMEOUT     HTTP request timeout in seconds (default: 15)</text>
<text x="24" y="412" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">  --json                Output results as JSON and suppress progress messages</text>
<text x="24" y="432" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4">  --log FILE            Write log to FILE (default: ./logs/os-finder.log)</text>
<rect x="0.5" y="0.5" width="979" height="479" rx="14" fill="none" stroke="#45475a"/>
</svg>
