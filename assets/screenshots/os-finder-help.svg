<svg xmlns="http://www.w3.org/2000/svg" width="839" height="444" viewBox="0 0 839 444">
<rect width="839" height="444" rx="14" fill="#1e1e2e"/>
<rect x="0" y="0" width="839" height="42" rx="14" fill="#181825"/>
<path d="M0 28 Q0 42 14 42 H825 Q839 42 839 28 V42 H0 Z" fill="#181825"/>
<circle cx="24" cy="21" r="6" fill="#f38ba8"/>
<circle cx="46" cy="21" r="6" fill="#f9e2af"/>
<circle cx="68" cy="21" r="6" fill="#a6e3a1"/>
<text x="419" y="26" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#7f849c">os-finder --help</text>
<text x="24" y="64" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#a6e3a1">$ os-finder --help</text>
<text x="24" y="92" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">usage: os-finder [-h] [--version] [--os OS [OS ...]] [--no-interactive] [--output OUTPUT]</text>
<text x="24" y="112" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">                 [--timeout TIMEOUT] [--json] [--check] [--log FILE]</text>
<text x="24" y="132" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve"></text>
<text x="24" y="152" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">Multi-OS Download Link Finder</text>
<text x="24" y="172" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve"></text>
<text x="24" y="192" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">options:</text>
<text x="24" y="212" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">  -h, --help         show this help message and exit</text>
<text x="24" y="232" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">  --version          show program's version number and exit</text>
<text x="24" y="252" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">  --os OS [OS ...]   Operating systems to resolve (default: all). One or more of: ubuntu,</text>
<text x="24" y="272" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">                     opnsense, pfsense, debian, truenas, windows11, manjaro, mxlinux, puppy,</text>
<text x="24" y="292" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">                     cachyos, fedora, opensuse, arch, linuxmint, rocky, all</text>
<text x="24" y="312" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">  --no-interactive   Disable the override URL prompt when a link cannot be found</text>
<text x="24" y="332" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">  --output OUTPUT    Output file for ISO URLs (default: ./os-links/all_os.txt)</text>
<text x="24" y="352" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">  --timeout TIMEOUT  HTTP request timeout in seconds (default: 15)</text>
<text x="24" y="372" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">  --json             Output results as JSON and suppress progress messages</text>
<text x="24" y="392" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">  --check            Report which OSes still resolve to an ISO and exit non-zero if any do not</text>
<text x="24" y="412" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">  --log FILE         Write log to FILE (default: ./logs/os-finder.log)</text>
</svg>
