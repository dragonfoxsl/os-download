name: Release

# Publishes to PyPI when a version tag is pushed. Uses Trusted Publishing (OIDC), so no
# API token is stored anywhere: configure the publisher once at
# https://pypi.org/manage/project/os-download/settings/publishing/
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest -q

      - name: Check the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(uv run python -c 'import os_download; print(os_download.__version__)')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package version $VERSION" >&2
            exit 1
          fi

      - run: uv build

      - name: Smoke-test the built wheel
        run: |
          venv="$(mktemp -d)/wheel-smoke"
          uv venv "$venv"
          uv pip install --python "$venv/bin/python" dist/*.whl
          "$venv/bin/os-download" --version
          "$venv/bin/os-finder" --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
