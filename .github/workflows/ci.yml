name: CI

on:
  schedule:
    - cron: "0 3 * * 5"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The aria2 and gpg paths are skipped when the binaries are absent, so install them
      # here or they would never actually run.
      - name: Install aria2 and gnupg
        run: sudo apt-get update && sudo apt-get install -y aria2 gnupg

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest -q

      # A green test suite does not prove the wheel and source archive can be produced.
      - name: Build package and verify sdist boundaries
        run: |
          touch local-only.txt
          uv build
          if tar -tzf dist/*.tar.gz | grep -q '/local-only.txt$'; then
            echo "Unrelated local file leaked into the source distribution" >&2
            exit 1
          fi
          rm local-only.txt

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run os-download --version
      - run: uv run os-finder --version
