name: CI

on:
  schedule:
    - cron: "0 3 * * 5"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # The aria2 and gpg paths are skipped when the binaries are absent, so install them
      # here or they would never actually run.
      - name: Install aria2 and gnupg
        run: sudo apt-get update && sudo apt-get install -y aria2 gnupg

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest -q
