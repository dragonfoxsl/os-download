name: Mirror canary

# Finders break silently when a mirror reorganises its directory layout. Catch that on a
# schedule rather than the next time someone tries to download.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Resolve every OS against its live mirror
        id: check
        run: |
          set -o pipefail
          : > report.txt
          status=1
          for attempt in 1 2 3; do
            echo "Mirror check attempt ${attempt}/3" | tee -a report.txt
            if uv run os-finder --check --no-interactive --log ./logs/canary.log 2>&1 | tee -a report.txt; then
              status=0
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done
          exit "$status"

      - name: Open an issue when a finder stops resolving
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const title = 'Mirror canary: a finder no longer resolves an ISO';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'mirror-canary',
            });
            const body = [
              'The scheduled mirror check failed. A mirror has most likely changed its',
              'directory layout, so the affected finder needs its scraping updated.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['mirror-canary'],
              });
            }

      - name: Close stale mirror-canary issues after recovery
        if: steps.check.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'mirror-canary',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `All finders recovered in [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). Closing this alert.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Upload the finder log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-log
          path: |
            report.txt
            logs/canary.log
          if-no-files-found: ignore
